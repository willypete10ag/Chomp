[project]
name = "chomp"
version = "0.1.0"
description = "Self-hosted MCP server that Claude uses as a meal-logging backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pillow>=11",
    "tzdata>=2026.5",
]

[project.scripts]
chomp = "chomp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chomp"]

[tool.hatch.build.targets.wheel.force-include]
"SCHEMA.sql" = "chomp/SCHEMA.sql"
"migrations" = "chomp/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
